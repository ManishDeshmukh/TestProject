name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: CLI smoke test on a clean library (must pass)
        run: |
          liberty-lint --db sqlite:///clean_check.db ingest tests/fixtures/clean.lib
          liberty-lint --db sqlite:///clean_check.db check --library-name synth_lib

      - name: CLI smoke test on the violation fixture (must fail)
        run: |
          liberty-lint --db sqlite:///sample_check.db ingest tests/fixtures/sample.lib
          if liberty-lint --db sqlite:///sample_check.db check --library-name synth_lib; then
            echo "expected violations to be detected in tests/fixtures/sample.lib" >&2
            exit 1
          fi
